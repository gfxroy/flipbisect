[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipbisect"
version = "0.1.0"
description = "git bisect for LLM nondeterminism: find the server setting that makes temperature-0 outputs diverge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Aaditya Roy"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flipbisect = "flipbisect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
